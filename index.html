<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>לוח המשפחה</title>
<style>
  :root {
    color-scheme: dark;
    --bg:    #0c1116;
    --panel: #151d26;
    --panel2:#1b2531;
    --line:  #26323f;
    --text:  #e9eff6;
    --muted: #7d8b9c;
    --c:     #2563eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  #app { height: 100%; }

  /* ← points correctly in LTR; in RTL "back" means pointing right. */
  [dir="rtl"] .backArrow { display: inline-block; transform: scaleX(-1); }

  /* ---------- login ---------- */
  #login { height: 100%; display: grid; place-items: center; padding: 24px; }
  #loginForm { width: min(380px, 100%); display: grid; gap: 12px; }
  #loginForm h1 { margin: 0; font-size: 30px; font-weight: 700; }
  #loginForm .sub { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  #loginForm input {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
    -webkit-user-select: text; user-select: text;
  }
  #loginForm input:focus { outline: none; border-color: var(--c); }
  #loginBtn {
    all: unset; cursor: pointer; text-align: center; margin-top: 6px;
    padding: 16px; border-radius: 12px; background: var(--c);
    font-weight: 600; color: #fff;
  }
  #loginBtn[disabled] { opacity: .5; cursor: default; }
  #loginError:empty { display: none; }
  #loginError { margin: 4px 0 0; color: #ff8b9a; font-size: 15px; }
  .langLine { text-align: center; margin: 10px 0 0; }
  .langBtn {
    all: unset; cursor: pointer; padding: 8px 16px; border-radius: 999px;
    background: var(--panel2); color: var(--muted); font-size: 14px; font-weight: 600;
  }
  .langBtn:active { background: #24303e; }

  /* ---------- home ---------- */
  #homeView { height: 100%; overflow-y: auto; }
  .homeTop {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 24px 10px;
  }
  .eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  #home { display: grid; gap: 14px; padding: 6px 24px 32px; }
  .card {
    all: unset; cursor: pointer;
    display: grid; grid-template-columns: 1fr auto;
    grid-template-areas: "name count" "dots count" "week week";
    align-items: center; column-gap: 20px;
    padding: 22px 26px; border-radius: 20px;
    background: var(--panel); border-inline-start: 10px solid var(--c);
  }
  .card:active { background: var(--panel2); }
  .name  { grid-area: name; font-size: clamp(22px, 3.6vw, 36px); font-weight: 600; }
  .count {
    grid-area: count; direction: ltr; /* keep "0 / 2" in reading order */
    font-size: clamp(26px, 4.6vw, 46px); font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--c);
  }
  .dots  {
    grid-area: dots; display: flex; flex-wrap: wrap; gap: 7px;
    margin-top: 8px; min-height: 13px;
  }
  .dot   { width: 13px; height: 13px; border-radius: 50%; background: #2c3846; }
  .dot.on{ background: #22c55e; }
  .dot.gone { background: transparent; box-shadow: inset 0 0 0 2px #5c3038; }
  .count.dim { color: var(--muted); opacity: .5; }
  .unplanned { font-size: 15px; color: var(--muted); font-style: italic; }

  /* ---------- shared top bar ---------- */
  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, transparent), transparent);
    box-shadow: inset 0 4px 0 var(--c);
  }
  .bar .btn {
    all: unset; cursor: pointer; padding: 10px 16px; border-radius: 12px;
    background: var(--panel2); font-size: 16px; font-weight: 600; text-align: center;
  }
  .bar .btn:active { background: #232f3d; }
  .bar .grow { flex: 1; font-size: clamp(20px, 3vw, 30px); font-weight: 700; }
  #count { font-variant-numeric: tabular-nums; color: var(--c); font-weight: 700;
           font-size: clamp(18px, 2.6vw, 26px); direction: ltr; }

  /* ---------- person board ---------- */
  #person, #manage { height: 100%; display: flex; flex-direction: column; }
  #todayList { flex: 1; overflow-y: auto; padding: 14px 18px 40px; display: grid; gap: 10px; align-content: start; }

  .task { display: flex; align-items: stretch; gap: 8px; }
  .task .toggle {
    all: unset; cursor: pointer; flex: 1;
    display: flex; align-items: center; gap: 18px;
    padding: 20px 22px; border-radius: 16px; background: var(--panel);
    min-height: 68px;
  }
  .task .toggle:active { background: var(--panel2); }
  .task .mark {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    border: 2.5px solid #3a4756; position: relative;
  }
  .task .title { font-size: clamp(18px, 2.4vw, 24px); font-weight: 500; }
  .task .goneTag {
    font-size: 12px; color: #ff8b9a; text-transform: uppercase;
    letter-spacing: .06em; margin-inline-start: auto;
  }
  .task .abandon {
    all: unset; cursor: pointer; width: 54px; flex: none;
    display: grid; place-items: center; border-radius: 16px;
    background: var(--panel); color: #ef4444; font-size: 20px; font-weight: 700;
  }
  .task .abandon:active { background: #3a2028; }

  /* completed */
  .task.is-done .toggle { background: color-mix(in srgb, #22c55e 12%, transparent); }
  .task.is-done .title { color: var(--muted); text-decoration: line-through; }
  .task.is-done .mark { border-color: #22c55e; background: #22c55e; }
  .task.is-done .mark::after {
    content: ""; position: absolute; inset: 0; margin: auto;
    width: 8px; height: 14px; border: solid var(--bg);
    border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -2px);
  }

  /* abandoned */
  .task.is-gone .toggle { background: transparent; opacity: .55; }
  .task.is-gone .title { color: var(--muted); text-decoration: line-through; }
  .task.is-gone .mark { border-color: #7f3b45; border-style: dashed; }
  .task.is-gone .abandon { color: var(--muted); }

  .task.first-closed { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
  .empty { padding: 36px 22px; color: var(--muted); font-size: 17px; line-height: 1.6; }

  /* ---------- celebration ---------- */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  #confetti .bit {
    position: absolute;
    animation: burst var(--dur) cubic-bezier(.15,.6,.35,1) var(--delay, 0ms) forwards;
    opacity: 0;
  }
  @keyframes burst {
    0%   { transform: translate(-50%, -50%) rotate(0) scale(1); opacity: 1; }
    70%  { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 620px))
                     rotate(var(--rot)) scale(.85); opacity: 0; }
  }
  /* ---------- coin ---------- */
  .coin {
    position: absolute; width: var(--size); height: var(--size);
    margin-left: calc(var(--size) / -2); margin-top: calc(var(--size) / -2);
    perspective: 600px; pointer-events: none; z-index: 2;
    animation: coinRise 1.5s cubic-bezier(.18,.7,.3,1) forwards;
  }
  .coin.big { animation-duration: 2.1s; }
  .coinInner {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    animation: coinSpin 1.5s cubic-bezier(.25,.6,.3,1) forwards;
  }
  .coin.big .coinInner { animation-duration: 2.1s; }
  .coinInner svg { width: 100%; height: 100%; display: block; }
  .coin .shine {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  }
  .coin .shine::after {
    content: ""; position: absolute; top: -60%; left: -120%;
    width: 60%; height: 220%; transform: rotate(22deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent);
    animation: coinShine 1.5s ease-in-out 2;
  }
  .coin.big .shine::after { animation-duration: 1.05s; animation-iteration-count: 3; }
  @keyframes coinRise {
    0%   { transform: translateY(0) scale(.3); opacity: 0; }
    18%  { transform: translateY(-26px) scale(1.12); opacity: 1; }
    30%  { transform: translateY(-38px) scale(1); }
    72%  { transform: translateY(-74px) scale(1); opacity: 1; }
    100% { transform: translateY(-118px) scale(.86); opacity: 0; }
  }
  @keyframes coinSpin {
    0%   { transform: rotateY(0); }
    100% { transform: rotateY(1440deg); }
  }
  @keyframes coinShine {
    0%   { left: -120%; }
    100% { left: 160%; }
  }

  #cheer {
    position: fixed; inset-inline: 0; top: 20%; z-index: 41;
    text-align: center; pointer-events: none;
    font-size: clamp(26px, 4vw, 38px); font-weight: 800; color: #22c55e;
    opacity: 0; text-shadow: 0 2px 18px rgba(0,0,0,.7);
  }
  #cheer.big { font-size: clamp(34px, 7vw, 64px); }
  #cheer.show { animation: cheerPop 2s ease forwards; }
  #cheer.big.show { animation-duration: 2.8s; }
  @keyframes cheerPop {
    0%   { opacity: 0; transform: scale(.7); }
    12%  { opacity: 1; transform: scale(1.08); }
    22%  { transform: scale(1); }
    80%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.02); }
  }

  /* ---------- plan panel ---------- */
  #scrim {
    position: fixed; inset: 0; background: #000; opacity: 0;
    pointer-events: none; transition: opacity .18s;
  }
  #scrim.on { opacity: .5; pointer-events: auto; }
  #planPanel {
    position: fixed; top: 0; bottom: 0; inset-inline-end: 0; z-index: 2;
    width: min(420px, 88vw); background: var(--panel);
    border-inline-start: 1px solid var(--line);
    transform: translateX(100%); transition: transform .22s ease;
    display: flex; flex-direction: column;
  }
  [dir="rtl"] #planPanel { transform: translateX(-100%); }
  #planPanel.open, [dir="rtl"] #planPanel.open { transform: none; }
  #planPanel h2 {
    margin: 0; padding: 20px 20px 10px; font-size: 14px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); font-weight: 600;
  }
  #planSearch {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin: 0 16px 10px;
    -webkit-user-select: text; user-select: text;
  }
  #planSearch:focus { outline: none; border-color: var(--c); }
  #tagBar { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  #tagBar:empty { display: none; }
  .chip {
    all: unset; cursor: pointer; padding: 7px 13px; border-radius: 999px;
    background: var(--panel2); font-size: 13px; color: var(--muted);
    border: 1px solid var(--line);
  }
  .chip.on {
    background: var(--c); color: #fff; border-color: var(--c); font-weight: 600;
  }
  #planList { overflow-y: auto; padding: 0 16px 28px; display: grid; gap: 8px; align-content: start; }
  .avail {
    all: unset; cursor: pointer; width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-radius: 14px; background: var(--panel2);
    min-height: 60px;
  }
  .avail:active { background: #24303e; }
  .avail .body { flex: 1; display: grid; gap: 2px; }
  .avail .title { font-size: 18px; }
  .avail .tags { font-size: 12px; color: var(--muted); }
  .avail .kind { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .avail .plus { font-size: 24px; color: var(--c); font-weight: 700; }
  .avail.added { opacity: .35; }

  /* ---------- sets in plan panel ---------- */
  #setBar { padding: 0 16px 12px; }
  #setBar:empty { display: none; }
  .setLabel {
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .setChip {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px; margin: 0 0 6px;
    margin-inline-end: 6px;
    background: color-mix(in srgb, var(--c) 20%, var(--panel2));
    border: 1px solid var(--c); font-size: 15px; font-weight: 600;
  }
  .setChip:active { background: var(--c); color: #fff; }
  .setChip .n { font-size: 12px; color: var(--muted); direction: ltr; }
  .setChip.added { opacity: .4; }

  /* ---------- manage ---------- */
  .sectionHead {
    padding: 16px 18px 8px; font-size: 13px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); font-weight: 600;
  }
  #setsSection { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .setList { display: grid; gap: 6px; padding: 0 18px; }
  .setRow { display: flex; gap: 6px; align-items: stretch; }
  .setMain {
    all: unset; cursor: pointer; flex: 1; display: grid; gap: 2px;
    padding: 12px 16px; border-radius: 12px; background: var(--panel);
  }
  .setRow.editing .setMain { box-shadow: inset 0 0 0 2px var(--c); }
  .setMain .title { font-size: 17px; font-weight: 600; }
  .setMain .meta { font-size: 12px; color: var(--muted); }
  .setRename {
    all: unset; cursor: pointer; padding: 0 14px; border-radius: 12px;
    background: var(--panel); font-size: 14px; color: var(--muted);
    display: grid; place-items: center;
  }
  .setRename:active { background: var(--panel2); }
  .hint { margin: 0; padding: 4px 18px 8px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .newSetRow { display: flex; gap: 8px; padding: 10px 18px 0; }
  #newSetName {
    flex: 1; font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    -webkit-user-select: text; user-select: text;
  }
  #newSetName:focus { outline: none; border-color: var(--c); }
  #newSetBtn {
    all: unset; cursor: pointer; padding: 12px 18px; border-radius: 12px;
    background: var(--panel2); font-weight: 600;
  }
  #newSetBtn:active { background: #24303e; }

  .poolMain.pick { display: flex; align-items: center; gap: 14px; }
  .poolMain.pick .body { display: grid; gap: 2px; }
  .poolMain.pick .tick {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    border: 2px solid #3a4756; position: relative;
  }
  .poolMain.pick.on .tick { background: var(--c); border-color: var(--c); }
  .poolMain.pick.on .tick::after {
    content: ""; position: absolute; inset: 0; margin: auto;
    width: 7px; height: 12px; border: solid var(--bg);
    border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -2px);
  }

  #setDoneBar {
    display: flex; align-items: center; gap: 12px;
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
  }
  #setDoneName { flex: 1; font-weight: 600; }
  #setDoneBtn {
    all: unset; cursor: pointer; padding: 14px 28px; border-radius: 12px;
    background: var(--c); color: #fff; font-weight: 600;
  }

  #poolList { flex: 1; overflow-y: auto; padding: 14px 18px 20px; display: grid; gap: 8px; align-content: start; }
  .pool { display: flex; gap: 8px; }
  .poolMain {
    all: unset; cursor: pointer; flex: 1; display: grid; gap: 3px;
    padding: 14px 18px; border-radius: 14px; background: var(--panel);
  }
  .pool.editing .poolMain { box-shadow: inset 0 0 0 2px var(--c); }
  .poolMain .title { font-size: 18px; font-weight: 500; }
  .poolMain .meta { font-size: 13px; color: var(--muted); }
  .poolDel {
    all: unset; cursor: pointer; width: 52px; flex: none;
    display: grid; place-items: center; border-radius: 14px;
    background: var(--panel); font-size: 17px;
  }
  .poolDel:active { background: #3a2028; }

  #taskForm {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    display: grid; gap: 10px;
  }
  #taskForm input, #taskForm select {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    -webkit-user-select: text; user-select: text;
  }
  #taskForm input:focus, #taskForm select:focus { outline: none; border-color: var(--c); }
  #tDays { display: flex; flex-wrap: wrap; gap: 6px; }
  #tDays label {
    cursor: pointer; padding: 9px 14px; border-radius: 999px;
    background: var(--panel2); font-size: 14px; color: var(--muted);
    border: 1px solid var(--line);
  }
  #tDays input { position: absolute; opacity: 0; pointer-events: none; }
  #tDays label:has(input:checked) {
    background: var(--c); color: #fff; border-color: var(--c); font-weight: 600;
  }
  #saveTask {
    all: unset; cursor: pointer; text-align: center; padding: 15px;
    border-radius: 12px; background: var(--c); font-weight: 600; color: #fff;
  }
  #saveTask[disabled] { opacity: .5; }
  #cancelEdit {
    all: unset; cursor: pointer; text-align: center; padding: 15px;
    border-radius: 12px; background: var(--panel2); font-weight: 600;
  }
  #manageError:empty { display: none; }
  #manageError { margin: 0; color: #ff8b9a; font-size: 14px; }

  .trendBox { grid-area: week; margin-top: 10px; height: 46px; }
  .trendBox:empty { display: none; }
  .trend { width: 100%; height: 100%; display: block; overflow: visible; }
  /* time runs toward the reading edge: left-to-right in LTR, right-to-left in RTL */
  [dir="rtl"] .trend { transform: scaleX(-1); }
  .tDone      { fill: var(--c); opacity: .55; }
  .tPlanned   { fill: var(--c); opacity: .16; }
  .tDoneLine  { fill: none; stroke: var(--c); stroke-width: 2;
                stroke-linejoin: round; stroke-linecap: round;
                vector-effect: non-scaling-stroke; }
  .tPlannedLine { fill: none; stroke: var(--c); stroke-width: 1.5; opacity: .45;
                  stroke-dasharray: 3 3; stroke-linejoin: round;
                  vector-effect: non-scaling-stroke; }
  .tNow { stroke: var(--muted); stroke-width: 1; opacity: .5; }

  .trendBig { padding: 4px 18px 0; height: 150px; }
  .legend {
    display: flex; gap: 18px; padding: 6px 18px 0;
    font-size: 13px; color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend .sw { width: 14px; height: 10px; border-radius: 3px; background: var(--c); }
  .legend .sw.done { opacity: .55; }
  .legend .sw.planned { opacity: .16; box-shadow: inset 0 0 0 1px var(--c); }

  /* ---------- rate colouring in plan panel ---------- */
  .avail.r1 { box-shadow: inset 3px 0 0 color-mix(in srgb, #22c55e 25%, transparent); }
  .avail.r2 { box-shadow: inset 3px 0 0 color-mix(in srgb, #22c55e 45%, transparent); }
  .avail.r3 { box-shadow: inset 3px 0 0 color-mix(in srgb, #22c55e 70%, transparent); }
  .avail.r4 { box-shadow: inset 3px 0 0 #22c55e; }
  [dir="rtl"] .avail.r1, [dir="rtl"] .avail.r2,
  [dir="rtl"] .avail.r3, [dir="rtl"] .avail.r4 { box-shadow: none; }
  [dir="rtl"] .avail.r1 { box-shadow: inset -3px 0 0 color-mix(in srgb, #22c55e 25%, transparent); }
  [dir="rtl"] .avail.r2 { box-shadow: inset -3px 0 0 color-mix(in srgb, #22c55e 45%, transparent); }
  [dir="rtl"] .avail.r3 { box-shadow: inset -3px 0 0 color-mix(in srgb, #22c55e 70%, transparent); }
  [dir="rtl"] .avail.r4 { box-shadow: inset -3px 0 0 #22c55e; }

  /* ---------- stats ---------- */
  #stats { height: 100%; display: flex; flex-direction: column; }
  #statsBody { flex: 1; overflow-y: auto; padding-bottom: 40px; }
  .statGrid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    padding: 16px 18px 4px;
  }
  .stat { background: var(--panel); border-radius: 14px; padding: 16px 14px; text-align: center; }
  .statNum {
    font-size: clamp(26px, 5vw, 40px); font-weight: 700; color: var(--c);
    font-variant-numeric: tabular-nums; direction: ltr;
  }
  .statLbl { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.3; }

  .heatWrap { display: flex; gap: 8px; padding: 4px 18px 8px; align-items: flex-start; }
  .heatDays {
    display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px;
    font-size: 10px; color: var(--muted); text-align: center;
  }
  .heatDays span { height: 18px; line-height: 18px; }
  .heat {
    flex: 1; display: grid; grid-template-columns: repeat(8, 1fr);
    grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px;
  }
  .cell { height: 18px; border-radius: 4px; background: #1b2531; }
  .cell.blank { background: transparent; }
  .cell.l1 { background: color-mix(in srgb, #22c55e 28%, #1b2531); }
  .cell.l2 { background: color-mix(in srgb, #22c55e 50%, #1b2531); }
  .cell.l3 { background: color-mix(in srgb, #22c55e 72%, #1b2531); }
  .cell.l4 { background: #22c55e; }

  .taskStats { display: grid; gap: 12px; padding: 4px 18px 0; }
  .tsTop { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .tsTitle { flex: 1; font-size: 16px; }
  .tsN { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .tsBar { height: 8px; border-radius: 4px; background: #1b2531; overflow: hidden; }
  .tsBar span { display: block; height: 100%; background: var(--c); border-radius: 4px; }

  #version {
    position: fixed; inset-inline-end: 8px; bottom: 6px; z-index: 3;
    font-size: 11px; color: var(--muted); opacity: .75;
    font-variant-numeric: tabular-nums; pointer-events: none;
    direction: ltr;
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  :focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
</style>
</head>
<body>

  <section id="login" hidden>
    <form id="loginForm">
      <h1 id="loginTitle"></h1>
      <p id="loginSub" class="sub"></p>
      <input id="email" type="email" autocomplete="username" required>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" type="submit"></button>
      <p id="loginError" role="alert"></p>
      <p class="langLine"><button type="button" class="langBtn"></button></p>
    </form>
  </section>

  <div id="app">

    <section id="homeView">
      <div class="homeTop">
        <span id="homeEyebrow" class="eyebrow"></span>
        <button type="button" class="langBtn"></button>
      </div>
      <main id="home"></main>
    </section>

    <section id="person" hidden>
      <div class="bar">
        <button id="back" class="btn"><span class="backArrow">←</span></button>
        <span id="personName" class="grow" dir="auto"></span>
        <span id="count"></span>
        <a id="statsLink" class="btn" href="#"></a>
        <a id="manageLink" class="btn" href="#"></a>
        <button id="planBtn" class="btn" aria-expanded="false" aria-controls="planPanel"></button>
      </div>
      <ul id="todayList"></ul>
    </section>

    <section id="manage" hidden>
      <div class="bar">
        <a id="manageBack" class="btn" href="#"><span class="backArrow">←</span></a>
        <span id="manageName" class="grow" dir="auto"></span>
      </div>
      <div id="setsSection"></div>
      <div id="poolHead" class="sectionHead" hidden></div>
      <ul id="poolList"></ul>
      <div id="setDoneBar" hidden>
        <span id="setDoneName" dir="auto"></span>
        <button id="setDoneBtn" type="button"></button>
      </div>
      <form id="taskForm">
        <input id="tTitle" type="text" dir="auto" autocomplete="off" required>
        <input id="tTags" type="text" dir="auto" autocomplete="off">
        <select id="tKind">
          <option id="optRecurring" value="recurring"></option>
          <option id="optGeneral" value="general"></option>
        </select>
        <div id="daysRow">
          <div id="tDays">
            <label><input type="checkbox" value="0"><span></span></label>
            <label><input type="checkbox" value="1"><span></span></label>
            <label><input type="checkbox" value="2"><span></span></label>
            <label><input type="checkbox" value="3"><span></span></label>
            <label><input type="checkbox" value="4"><span></span></label>
            <label><input type="checkbox" value="5"><span></span></label>
            <label><input type="checkbox" value="6"><span></span></label>
          </div>
        </div>
        <p id="manageError" role="alert"></p>
        <button id="saveTask" type="submit"></button>
        <button id="cancelEdit" type="button" hidden></button>
      </form>
    </section>

    <section id="stats" hidden>
      <div class="bar">
        <a id="statsBack" class="btn" href="#"><span class="backArrow">←</span></a>
        <span id="statsName" class="grow" dir="auto"></span>
      </div>
      <div id="statsBody"></div>
    </section>

  </div>

  <aside id="planPanel" aria-label="Available tasks">
    <h2 id="planTitle"></h2>
    <div id="setBar"></div>
    <input id="planSearch" type="search" dir="auto" autocomplete="off">
    <div id="tagBar"></div>
    <ul id="planList"></ul>
  </aside>
  <div id="scrim"></div>

  <div id="confetti" aria-hidden="true"></div>
  <div id="cheer" role="status" aria-live="polite"></div>

  <div id="version"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
